<svg xmlns="http://www.w3.org/2000/svg" class="vt-skyline__city" data-city="amherst" viewBox="0 0 960 200" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <desc>Original UMass Amherst illustration of just Old Chapel and W. E. B. Du Bois Library. The chapel has a clock face, arched belfry openings, and gables; the library has a flat roof and tall facade ribs. The chapel is less than 45 percent of the library's height.</desc>
